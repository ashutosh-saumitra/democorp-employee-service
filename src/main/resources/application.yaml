spring:
  application:
    name: democorp-employee-service
  devtools:
    restart:
      enabled: false
  datasource:
    url: jdbc:h2:mem:democorp
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
      path: /h2-console